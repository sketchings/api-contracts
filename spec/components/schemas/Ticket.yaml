description: Ticket for museum entry, can be general admission or special event.
type: object
properties:
  ticketId:
    $ref: ./TicketId.yaml
  ticketDate:
    description: Date when this ticket can be used for museum entry.
    $ref: ./Date.yaml
  ticketType:
    $ref: ./TicketType.yaml
  eventId:
    description: >-
      Unique identifier for a special event. Required if purchasing tickets for
      the museum's special events.
    $ref: ./EventId.yaml
required:
  - ticketType
  - ticketDate

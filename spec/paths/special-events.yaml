post:
  summary: Create special events
  description: Creates a new special event for the museum.
  operationId: createSpecialEvent
  tags:
    - Events
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SpecialEvent.yaml
        examples:
          default_example:
            $ref: ../components/examples/CreateSpecialEventRequestExample.yaml
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SpecialEvent.yaml
          examples:
            default_example:
              $ref: ../components/examples/CreateSpecialEventResponseExample.yaml
      links:
        GetSpecialEvent:
          description: The `eventId` returned can be used to get the event.
          operationId: getSpecialEvent
          parameters:
            eventId: $response.body#/eventId
        UpdateSpecialEvent:
          description: The `eventId` returned can be used to update the event.
          operationId: updateSpecialEvent
          parameters:
            eventId: $response.body#/eventId
        DeleteSpecialEvent:
          description: The `eventId` returned can be used to delete the event.
          operationId: deleteSpecialEvent
          parameters:
            eventId: $response.body#/eventId
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
get:
  summary: List special events
  description: Return a list of upcoming special events at the museum.
  operationId: listSpecialEvents
  tags:
    - Events
  parameters:
    - $ref: ../components/parameters/StartDate.yaml
    - $ref: ../components/parameters/EndDate.yaml
    - $ref: ../components/parameters/PaginationPage.yaml
    - $ref: ../components/parameters/PaginationLimit.yaml
  responses:
    '200':
      description: Success.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SpecialEventCollection.yaml
          examples:
            default_example:
              $ref: ../components/examples/ListSpecialEventsResponseExample.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml

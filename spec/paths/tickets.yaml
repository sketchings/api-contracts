post:
  summary: Buy museum tickets
  description: Purchase museum tickets for general entry or special events.
  operationId: buyMuseumTickets
  tags:
    - Tickets
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BuyMuseumTickets.yaml
        examples:
          general_entry:
            $ref: ../components/examples/BuyGeneralTicketsRequestExample.yaml
          event_entry:
            $ref: ../components/examples/BuyEventTicketsRequestExample.yaml
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MuseumTicketsConfirmation.yaml
          examples:
            general_entry:
              $ref: ../components/examples/BuyGeneralTicketsResponseExample.yaml
            event_entry:
              $ref: ../components/examples/BuyEventTicketsResponseExample.yaml
      links:
        GetTicketCode:
          description: The `ticketId` returned can be used to get the ticket's QR code.
          operationId: getTicketCode
          parameters:
            ticketId: $response.body#/ticketId
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml

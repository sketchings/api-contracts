      # TODO 2 — get-event
      #   operationId: getSpecialEvent
      #   parameters: eventId (in: path) = the create step's output
      #     ($steps.create-event.outputs.eventId)
      #   successCriteria: status 200

      # TODO 3 — update-event
      #   operationId: updateSpecialEvent, same eventId parameter
      #   requestBody.payload: change one field, e.g. price
      #   successCriteria: status 200, plus a jsonpath check on the new value:

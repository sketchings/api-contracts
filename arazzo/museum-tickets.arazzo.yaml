arazzo: 1.0.1
info:
  title: Redocly Museum Tickets Workflow
  description: >-
    Use the Museum API as an example in a simple Arazzo workflow.
    Built with love by Redocly.
  version: 1.0.1

sourceDescriptions:
  - name: museum-api
    type: openapi
    url: ../openapi.yaml
    x-serverUrl: "https://localhost:8000" # For local development testing

workflows:
  - workflowId: get-museum-tickets
    description: >-
      This workflow demonstrates how to buy tickets for the museum.
    inputs:
      type: object
      properties:
        env:
          type: object
          description: Read from environment variables.
          properties:
            MUSEUM_API_USER:
              type: string
              description: Username for MuseumPlaceholderAuth (HTTP basic).
            MUSEUM_API_PASSWORD:
              type: string
              format: password
              description: Password for MuseumPlaceholderAuth (HTTP basic).
          required:
            - MUSEUM_API_USER
            - MUSEUM_API_PASSWORD
      required:
        - env
    x-security:
      - schemeName: MuseumPlaceholderAuth
        values:
          username: $inputs.env.MUSEUM_API_USER
          password: $inputs.env.MUSEUM_API_PASSWORD
    steps:
      - stepId: buy-tickets
        description: >-
          Buy museum tickets resolving request details with buyMuseumTickets operationId from openapi.yaml description.
        operationId: buyMuseumTickets
        requestBody:
          payload:
            ticketType: general
            ticketDate: '2023-09-07'
            email: todd@example.com
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          ticketId: $response.body#/ticketId
    outputs:
      ticketId: $steps.buy-tickets.outputs.ticketId
